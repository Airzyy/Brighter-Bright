plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.airzyy'
version = '1.0.0'

base {
    archivesName = 'Brighter-Bright'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.234'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'brighterbright'
        }
    }

    mods {
        brighterbright {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

// Modrinth distributes the NeoForge mod as a wrapper JAR. Sodium's public
// API is in the nested jarjar mod, so expose that inner JAR to javac.
configurations {
    sodiumMod
}

def sodiumModJarPath = 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.13+mc1.21.1-mod.jar'
def sodiumApiJar = layout.buildDirectory.file('sodium-api/sodium-api.jar')

dependencies {
    sodiumMod 'maven.modrinth:AANobbMI:uMOpc5uV'
    compileOnly files(sodiumApiJar)
}

tasks.register('extractSodiumApi', Copy) {
    from({ zipTree(configurations.sodiumMod.singleFile) }) {
        include sodiumModJarPath
        eachFile { details ->
            details.path = 'sodium-api.jar'
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sodium-api')
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('extractSodiumApi')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
